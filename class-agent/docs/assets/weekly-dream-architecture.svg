<text x="1390" y="502" fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" dominant-baseline="central">Student builds + activity</text>
<rect x="475" y="710" width="300" height="90" rx="0" fill="#141020" stroke="#b0a0ed" stroke-width="2"/>
<text x="625" y="741" fill="#b0a0ed" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central">Weekly dream</text>
<text x="625" y="775" fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">Email draft</text>
