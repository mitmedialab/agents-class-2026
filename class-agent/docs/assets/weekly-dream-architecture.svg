<path d="M 787 438 C 850 385, 858 300, 910 288" fill="none" stroke="#d4d4d4" stroke-width="2" marker-end="url(#arrow)"/>
<text x="855" y="402" fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">Action</text>
<path d="M 1209 288 C 1330 288, 1390 340, 1390 390" fill="none" stroke="#d4d4d4" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1238 511 C 1120 661, 918 657, 788 510" fill="none" stroke="#d4d4d4" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1030" y="659" fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">Observations</text>
<path d="M 625 535 L 625 695" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="650" y="618" fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">Finish</text>
<text x="80" y="863" fill="#999999" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="central">Adapted from course slides: Week 2, slide 7; Week 7, slide 5.</text>
