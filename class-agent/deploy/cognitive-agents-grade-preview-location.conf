# Include inside the existing HTTPS server to test the new site without changing /.
location = /grade-preview {
    return 302 /grade-preview/;
}

location ^~ /grade-preview/api/ {
    client_max_body_size 11m;
    limit_req zone=class_agent_api burst=20 nodelay;
    limit_conn class_agent_connections 20;
    proxy_pass http://127.0.0.1:8002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

location ^~ /grade-preview/assets/ {
    alias /home/wazeer/grade-preview-site/dist/assets/;
    expires 1y;
}

location = /grade-preview/index.html {
    alias /home/wazeer/grade-preview-site/dist/index.html;
    expires -1;
}

location ^~ /grade-preview/ {
    alias /home/wazeer/grade-preview-site/dist/;
    try_files $uri $uri/ /grade-preview/index.html;
    expires -1;
}
