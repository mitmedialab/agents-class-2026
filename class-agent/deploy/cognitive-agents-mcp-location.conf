# Add this location inside the existing HTTPS server block, before the SPA fallback.
# Do not replace the live site's other rate-limit settings with a template.
location ~ ^/(mcp|mcp-pages\.css|ai-connect|connect|connections|learning-contract(?:\.md)?|messages(?:/.*)?|authorize|token|register|revoke|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource/mcp)$ {
    client_max_body_size 64k;
    limit_req zone=class_agent_api burst=20 nodelay;
    limit_conn class_agent_connections 20;
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
}
