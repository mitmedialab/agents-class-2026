[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "class-agent"
version = "0.1.0"
description = "MIT Cognitive Agent course platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "smolagents[openai,toolkit]>=1.26,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["python/agent_core", "python/course_server", "python/runtime_smolagents"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["python/tests"]
markers = [
  "postgres: requires TEST_DATABASE_URL and a reachable PostgreSQL server",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python/agent_core", "python/course_server", "python/runtime_smolagents", "python/tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jsonschema.*", "smolagents", "smolagents.*"]
ignore_missing_imports = true
